<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТурбоМатематика — Призма</title>
<style>
body{margin:0;background:#f3f6fb;font-family:Arial,sans-serif;color:#172033}#app{max-width:900px;margin:30px auto;padding:24px;background:white;border-radius:20px;box-shadow:0 5px 25px #ccd3df}h1{font-size:32px}h2{line-height:1.3}.tag{display:inline-block;background:#eaf0ff;color:#2457d6;padding:7px 12px;border-radius:20px;font-weight:bold}.top,.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.meta{margin:15px 0;color:#657089}.bar{height:8px;background:#e4e8ef;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#2457d6}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{padding:17px;border:2px solid #dce2ec;background:white;border-radius:14px;text-align:left;cursor:pointer;font-size:16px;line-height:1.35}.opt.sel{border-color:#2457d6;background:#eef4ff}.opt.good{border-color:#198754;background:#e9f7ef}.opt.bad{border-color:#dc3545;background:#fff0f0}button.go{margin-top:18px;padding:12px 22px;border:0;border-radius:11px;background:#2457d6;color:white;font-weight:bold;cursor:pointer}button.go:disabled{opacity:.4}.center{text-align:center}.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.rule{padding:12px;border:1px solid #dde3ed;border-radius:12px}.rule b{display:block;color:#2457d6}.fb{margin-top:15px;padding:12px;border-radius:10px;font-weight:bold}.ok{background:#e9f7ef;color:#176b43}.no{background:#fff0f0;color:#9b242d}.score{font-size:50px;font-weight:900}@media(max-width:650px){.opts,.rules{grid-template-columns:1fr}#app{margin:10px;padding:18px}}
</style></head><body><main id="app"></main>
<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzd-G7knVDhmRtoIO9aTA1crTiHxRLnavHX_HeDKdK0G0KYqwTAihb2-ucLYGyUv8ux/exec";
const Q=[{"level": "Початковий рівень", "time": 15, "q": "Що називають призмою?", "o": ["Многогранник, що складається з двох рівних многокутників у паралельних площинах і бічної поверхні з паралелограмів", "Многогранник, усі грані якого є трикутниками", "Многогранник із двома довільними многокутниками в паралельних площинах", "Многогранник, усі грані якого є прямокутниками"], "c": [0]}, {"level": "Початковий рівень", "time": 15, "q": "Якими є бічні грані призми?", "o": ["Трикутниками", "Паралелограмами", "Трапеціями", "Кругами"], "c": [1]}, {"level": "Початковий рівень", "time": 15, "q": "Що називають висотою призми?", "o": ["Довжину будь-якого бічного ребра", "Діагональ призми", "Відстань між площинами її основ", "Периметр основи"], "c": [2]}, {"level": "Початковий рівень", "time": 15, "q": "Призма має 15 ребер. Який многокутник лежить у її основі?", "o": ["Трикутник", "Чотирикутник", "П’ятикутник", "Шестикутник"], "c": [2]}, {"level": "Початковий рівень", "time": 15, "q": "Скільки граней має п’ятикутна призма?", "o": ["5", "6", "7", "10"], "c": [2]}, {"level": "Середній рівень", "time": 15, "q": "За якої умови призма називається прямою?", "o": ["Бічні ребра перпендикулярні до площин основ", "Основами є квадрати", "Усі ребра призми рівні", "Основами є правильні многокутники"], "c": [0]}, {"level": "Середній рівень", "time": 15, "q": "Яке твердження правильне для прямої призми?", "o": ["Бічні ребра не пов’язані з висотою", "Бічні грані є довільними паралелограмами", "Бічні ребра збігаються з висотою призми", "Основи обов’язково є квадратами"], "c": [2]}, {"level": "Середній рівень", "time": 15, "q": "Призма має 18 ребер. Який многокутник лежить у її основі?", "o": ["Трикутник", "Чотирикутник", "Шестикутник", "Восьмикутник"], "c": [2]}, {"level": "Середній рівень", "time": 15, "q": "Призма має 8 граней. Який многокутник лежить у її основі?", "o": ["П’ятикутник", "Чотирикутник", "Трикутник", "Шестикутник"], "c": [3]}, {"level": "Середній рівень", "time": 15, "q": "Яка формула площі бічної поверхні прямої призми?", "o": ["Sбіч = Sосн · H", "Sбіч = Pосн · H", "Sбіч = 2Sосн", "Sбіч = Pосн + H"], "c": [1]}, {"level": "Достатній рівень", "time": 20, "q": "Оберіть 2 правильні твердження про призму.", "o": ["Основи призми рівні", "Основи призми обов’язково є правильними многокутниками", "Основи лежать у паралельних площинах", "Бічні ребра завжди перпендикулярні до основ"], "c": [0, 2]}, {"level": "Достатній рівень", "time": 20, "q": "Оберіть 2 правильні властивості прямої призми.", "o": ["Бічні ребра перпендикулярні до площин основ", "Бічні ребра дорівнюють висоті", "Основи обов’язково є квадратами", "Бічні грані є трикутниками"], "c": [0, 1]}, {"level": "Достатній рівень", "time": 20, "q": "Оберіть 2 правильні формули для призми.", "o": ["Sбіч = Pосн · H — для прямої призми", "Sповн = Sбіч + 2Sосн", "V = Pосн · H", "V = Pосн + H"], "c": [0, 1]}, {"level": "Достатній рівень", "time": 20, "q": "Призма має 24 ребра. Оберіть 2 правильні твердження.", "o": ["В основі лежить восьмикутник", "Призма має 10 граней", "Призма має 12 вершин", "Призма має 6 бічних граней"], "c": [0, 1]}, {"level": "Достатній рівень", "time": 20, "q": "Оберіть 2 правильні твердження щодо похилої призми.", "o": ["Бічні ребра не перпендикулярні до площин основ", "Sбіч = Pпер · l", "Висота завжди дорівнює довжині бічного ребра", "Бічні грані є прямокутниками"], "c": [0, 1]}, {"level": "Високий рівень", "time": 20, "q": "Оберіть 3 правильні твердження про правильну призму.", "o": ["Вона є прямою призмою", "Її основами є правильні многокутники", "Усі її грані є квадратами", "Її бічні грані — рівні прямокутники"], "c": [0, 1, 3]}, {"level": "Високий рівень", "time": 20, "q": "Оберіть 3 правильні твердження про прямокутний паралелепіпед.", "o": ["Усі його грані — прямокутники", "Він є прямою призмою, основами якої є прямокутники", "Квадрат будь-якої діагоналі дорівнює сумі квадратів трьох його вимірів", "Усі його ребра мають бути рівними"], "c": [0, 1, 2]}, {"level": "Високий рівень", "time": 20, "q": "Оберіть 3 правильні твердження про куб.", "o": ["Усі його грані — квадрати", "Діагональ куба дорівнює a√3", "Об’єм куба дорівнює a³", "Площа повної поверхні дорівнює 4a²"], "c": [0, 1, 2]}, {"level": "Високий рівень", "time": 20, "q": "Призма має 30 ребер. Оберіть 3 правильні твердження.", "o": ["В основі лежить десятикутник", "Призма має 12 граней", "Призма має 20 вершин", "Призма має 12 бічних граней"], "c": [0, 1, 2]}, {"level": "Високий рівень", "time": 20, "q": "Призма має 9 граней. Оберіть 3 правильні твердження.", "o": ["В основі лежить семикутник", "Призма має 21 ребро", "Призма має 14 вершин", "Призма має 8 бічних граней"], "c": [0, 1, 2]}];let n=0,score=0,sel=[],locked=false,timer=null,left=0,startTime=0,elapsedSeconds=0,surname="";
const A=()=>document.getElementById('app');
function start(){
 const field=document.getElementById('surname');
 surname=(field?.value||"").trim();
 if(!surname){alert("Будь ласка, введіть прізвище та ім’я.");return;}
 n=0;score=0;elapsedSeconds=0;startTime=Date.now();show();
}
function home(){A().innerHTML=`<div class="center"><span class="tag">11 клас • Геометрія</span><h1>ТурбоМатематика — ПРИЗМА</h1><p>20 теоретичних запитань без рисунків.</p>
<label style="display:block;text-align:left;max-width:430px;margin:18px auto 0;font-weight:bold">Прізвище та ім’я
<input id="surname" type="text" maxlength="80" placeholder="Введіть прізвище та ім’я" style="display:block;width:100%;margin-top:8px;padding:12px;border:1px solid #dce2ec;border-radius:10px;font-size:16px"></label><div class="rules"><div class="rule"><b>1–5</b>Початковий<br>1 відповідь • 15 с</div><div class="rule"><b>6–10</b>Середній<br>1 відповідь • 15 с</div><div class="rule"><b>11–15</b>Достатній<br>2 відповіді • 20 с</div><div class="rule"><b>16–20</b>Високий<br>3 відповіді • 20 с</div></div><button class="go" onclick="start()">ПОЧАТИ ГРУ</button></div>`}
function show(){clearInterval(timer);locked=false;sel=[];let x=Q[n],need=x.c.length;left=x.time;A().innerHTML=`<div class="top"><span class="tag">${x.level}</span><b>Рахунок: ${score} / 20</b></div><div class="meta"><span>Питання ${n+1} з 20</span><b id="tm">${left} с</b></div><div class="bar"><i style="width:${n/20*100}%"></i></div><h2>${x.q}</h2><p style="color:#657089">${x.c.length>1?'Оберіть '+need+' правильні відповіді.':'Оберіть одну правильну відповідь.'}</p><div class="opts">${x.o.map((v,k)=>`<button class="opt" id="o${k}" onclick="pick(${k})"><b>${'ABCD'[k]}</b>&nbsp; ${v}</button>`).join('')}</div><button class="go" id="go" disabled onclick="answer()">ВІДПОВІСТИ</button><div id="fb"></div>`;timer=setInterval(()=>{left--;let t=document.getElementById('tm');if(t)t.textContent=left+' с';if(left<=0)answer(true)},1000)}
function pick(k){if(locked)return;let need=Q[n].c.length;if(need===1)sel=[k];else{if(sel.includes(k))sel=sel.filter(x=>x!==k);else if(sel.length<need)sel.push(k)};[0,1,2,3].forEach(j=>document.getElementById('o'+j).classList.toggle('sel',sel.includes(j)));document.getElementById('go').disabled=sel.length!==need}
function answer(timeout=false){if(locked)return;let x=Q[n];if(!timeout&&sel.length!==x.c.length)return;locked=true;clearInterval(timer);let ok=!timeout&&sel.length===x.c.length&&sel.every(v=>x.c.includes(v))&&x.c.every(v=>sel.includes(v));if(ok)score++;x.o.forEach((_,j)=>{let e=document.getElementById('o'+j);if(x.c.includes(j))e.classList.add('good');else if(sel.includes(j))e.classList.add('bad');e.disabled=true});let f=document.getElementById('fb');f.className='fb '+(ok?'ok':'no');f.textContent=timeout?'Час вичерпано. Правильні відповіді підсвічено.':(ok?'Правильно!':'Правильні відповіді підсвічено.');let b=document.getElementById('go');b.disabled=false;b.textContent=n===19?'РЕЗУЛЬТАТ':'НАСТУПНЕ ПИТАННЯ';b.onclick=()=>n===19?result():(n++,show())}
function result(){clearInterval(timer);A().innerHTML=`<div class="center"><span class="tag">Гру завершено</span><h1>Твій результат</h1><div class="score">${score} / 20</div><p>${Math.round(score/20*100)}% правильних відповідей</p><button class="go" onclick="start()">ПРОЙТИ ЩЕ РАЗ</button></div>`}
home();
</script></body></html>
